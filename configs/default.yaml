data:
  root: "data/"
  batch_size: 64
model:
  gin_out_channels: 128
  mamba_d_model: 32
  mamba_expand: 2
  fusion_dim: 32
  gin_layers: 4
  gin_hidden: 128
  mamba_layers: 1
  mamba_conv: 4
  mamba_state: 32
  bidirectional: true
  dropout: 0.35
  rwse_walk_length: 10
  kan_gate: true
  pretrained_path: null
training:
  epochs: 45
  lr: 0.0005
  weight_decay: 0.05